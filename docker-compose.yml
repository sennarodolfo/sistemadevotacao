# =================================================================
# Supabase Local + Frontend (Votação Eletrônica)
# Roda o backend Supabase em Docker para uso em LAN ou testes locais.
# Para internet, use Supabase Cloud (veja docs/SETUP.md).
# =================================================================
version: "3.8"

services:
  # ============== FRONTEND (Vite/React) ==============
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: votacao-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_SUPABASE_URL=http://kong:8000
      - VITE_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - VITE_ELECTION_ID=${ELECTION_ID}
    depends_on:
      - kong
    networks:
      - votacao-net
    restart: unless-stopped

  # ============== SUPABASE: KONG (API Gateway) ==============
  kong:
    image: supabase/kong:2.1.1
    container_name: votacao-kong
    ports:
      - "8000:8000"   # API REST
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /home/kong/kong.yml
      KONG_DNS_ORDER: LAST
      KONG_PLUGINS: request-transformer,cors,key-auth,acl,basic-auth
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
    networks:
      - votacao-net
    restart: unless-stopped

  # ============== SUPABASE: POSTGRES ==============
  db:
    image: supabase/postgres:15.1.0.117
    container_name: votacao-db
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"   # exposto para acesso direto se necessário
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./supabase/migrations:/docker-entrypoint-initdb.d/migrations:ro
      - ./supabase/seed:/docker-entrypoint-initdb.d/seed:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h localhost"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - votacao-net
    restart: unless-stopped

  # ============== SUPABASE: GO-TRUE (Auth) ==============
  auth:
    image: supabase/gotrue:v2.99.0
    container_name: votacao-auth
    environment:
      GOTRUE_SITE_URL: http://localhost:5173
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_DISABLE_SIGNUP: "true"
    networks:
      - votacao-net
    restart: unless-stopped

  # ============== SUPABASE: POSTGREST (API REST automática) ==============
  rest:
    image: postgrest/postgrest:v12.0.1
    container_name: votacao-rest
    environment:
      PGRST_DB_URI: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_ANON_ROLE: anon
    networks:
      - votacao-net
    restart: unless-stopped

  # ============== SUPABASE: REALTIME ==============
  realtime:
    image: supabase/realtime:v2.25.21
    container_name: votacao-realtime
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: postgres
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      PORT: 4000
    networks:
      - votacao-net
    restart: unless-stopped

  # ============== SUPABASE: STUDIO (interface web admin) ==============
  studio:
    image: supabase/studio:20240101-8a5eaf6
    container_name: votacao-studio
    ports:
      - "54323:3000"  # Studio web em http://localhost:54323
    environment:
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - votacao-net
    restart: unless-stopped

volumes:
  db-data:
    driver: local

networks:
  votacao-net:
    driver: bridge
