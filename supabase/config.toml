# Configuração do Supabase local (para rodar em LAN/servidor local)
# Documentação: https://supabase.com/docs/guides/cli/local-development

project_id = "votacao-eletronica"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = true
ip_version = "IPv4"

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1:54321"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = [
  "http://localhost:3000",
  "http://127.0.0.1:5173",
  "http://192.168.0.1:5173",   # ajuste para o IP da sua rede LAN
]
jwt_expiry = 3600
enable_signup = false   # não permitir signup público

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = false

[edge_runtime]
enabled = true
ip_version = "IPv4"

[analytics]
enabled = false
